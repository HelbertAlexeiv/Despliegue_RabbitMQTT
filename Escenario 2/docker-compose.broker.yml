services:
  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: rabbitmq-scenario-2
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?Set RABBIT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?Set RABBIT_PASS in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq_data:
